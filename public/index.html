<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f9f9f8" />
    <meta
      name="description"
      content="Cloud Claude Chat - A mobile-friendly chat application powered by Claude AI"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Cloud Claude Chat</title>
    <style>
      @font-face {
        font-family: 'VF-Canto';
        src: url('/fonts/VF-Canto-HKEdB.woff2') format('woff2');
        font-display: swap;
        font-weight: 400;
      }
      @font-face {
        font-family: 'Hanzi-Pinyin';
        src: url('/fonts/Hanzi-Pinyin-Font.top.woff2') format('woff2');
        font-display: swap;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <script>
      // The saved theme applies before the first paint, so a dark-mode load doesn't start light.
      try {
        var savedTheme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        document.body.className = savedTheme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', savedTheme === 'dark' ? '#141414' : '#f9f9f8');
      } catch (e) {}
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
